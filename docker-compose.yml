services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: umanni_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    ports:
      - "5173:5173" 
    expose:
      - "9000"
    networks:
      - umanni-network

  nginx:
    image: nginx:1.19-alpine
    container_name: umanni_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      FASTCGI_READ_TIMEOUT: 300
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - umanni-network

  db:
    image: mysql:8.0
    container_name: umanni_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-umanni}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_USER: ${DB_USERNAME:-umanni}
    volumes:
      - ./docker/dbdata:/var/lib/mysql
    ports:
      - "33061:3306"
    networks:
      - umanni-network

  redis:
    image: redis:6.2-alpine
    container_name: umanni_redis
    restart: unless-stopped
    ports:
      - "63791:6379"
    networks:
      - umanni-network 

networks:
  umanni-network:
    driver: bridge